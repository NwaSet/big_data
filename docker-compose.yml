services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"    
    environment:
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNE://:9092,INTERNE://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNE://localhost:9092,INTERNE://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNE:PLAINTEXT,INTERNE:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNE"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"   
    volumes:
      - kafka-data:/var/lib/kafka/data  

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"     
    environment:
      KAFKA_CLUSTERS_0_NAME: "irail"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
    depends_on:
      - kafka

  producer:
    build: ./kafka
    image: irail-producer:1.0
    profiles: ["programmes"]
    command: ["python", "producer.py"]
    init: true  
    environment:
      KAFKA: "kafka:19092"
    volumes:
      - ./kafka:/app
    depends_on:
      - kafka

